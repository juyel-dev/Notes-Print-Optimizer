<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ultra Bright Vibrant Background Gradient -->
    <linearGradient id="brightBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5540FF"/>
      <stop offset="45%" stop-color="#8B1FFF"/>
      <stop offset="100%" stop-color="#E000FF"/>
    </linearGradient>

    <!-- Top Gloss Overlay Gradient for Extra Brightness -->
    <linearGradient id="glossOverlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF00CC" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Inner Glow & Drop Shadow Filter for Document -->
    <filter id="documentShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#21005E" flood-opacity="0.4"/>
    </filter>

    <!-- Glowing Checkmark Circle Gradient -->
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E3AFF"/>
      <stop offset="100%" stop-color="#5011FF"/>
    </linearGradient>
  </defs>

  <!-- Main Rounded Icon Frame (App Icon Style) -->
  <rect width="512" height="512" rx="140" fill="url(#brightBgGradient)"/>
  <rect width="512" height="512" rx="140" fill="url(#glossOverlay)"/>

  <!-- Main Document (Exact Original Geometry & Ratios) -->
  <g filter="url(#documentShadow)">
    <!-- Crisp White Sheet with Rounded Corners & Top Right Fold -->
    <path d="M 166 104 
             H 330 
             L 386 160 
             V 376 
             A 36 36 0 0 1 350 412 
             H 162 
             A 36 36 0 0 1 126 376 
             V 144 
             A 40 40 0 0 1 166 104 Z" 
          fill="#FFFFFF"/>
    
    <!-- Folded Corner Back Shadow -->
    <path d="M 330 104 L 386 160 H 346 A 16 16 0 0 1 330 144 Z" fill="#DDE4F5"/>
    
    <!-- Folded Corner Top Flap -->
    <path d="M 330 104 V 144 A 16 16 0 0 0 346 160 H 386 Z" fill="#F8FAFF"/>
  </g>

  <!-- Document Content: Vibrant Purple Rounded Lines -->
  <!-- Line 1 (Top Bar - High Contrast Vibrant Purple) -->
  <rect x="172" y="198" width="160" height="16" rx="8" fill="#5835FF"/>
  
  <!-- Line 2 (Middle Bar - Medium Purple) -->
  <rect x="172" y="233" width="126" height="16" rx="8" fill="#8868FF"/>
  
  <!-- Line 3 (Bottom Bar - Light Lavender Purple) -->
  <rect x="172" y="268" width="146" height="16" rx="8" fill="#BEA8FF"/>

  <!-- Checkmark Badge Container -->
  <g>
    <!-- Circular Badge background -->
    <circle cx="261" cy="348" r="40" fill="url(#badgeGradient)"/>
    
    <!-- Crisp White Checkmark -->
    <path d="M 239 349 L 253 363 L 283 331" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="8.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>