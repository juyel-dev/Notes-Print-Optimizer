name: Lighthouse CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL || 'https://script.google.com/macros/s/AKfycbyYBvhRphdbvTAEI-hktpUWcpYyFjdsOjSHhHwuQyt0K310uqIX3ManTNfQ1Kx7UEtw/exec' }}

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/${{ github.event.repository.name }}/
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL || 'https://script.google.com/macros/s/AKfycbyYBvhRphdbvTAEI-hktpUWcpYyFjdsOjSHhHwuQyt0K310uqIX3ManTNfQ1Kx7UEtw/exec' }}

      - name: Start server
        run: |
          mkdir -p serve-root
          cp -r out serve-root/${{ github.event.repository.name }}
          npx serve serve-root -l 3000 &

      - name: Wait for server
        run: sleep 3

      - name: Check Performance Budgets
        run: |
          npx lighthouse http://localhost:3000/${{ github.event.repository.name }}/ \
            --output=json \
            --output-path=./lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance \
            --preset=desktop \
            || true

          # Check if performance score meets budget
          SCORE=$(cat ./lighthouse-report.json | node -e "const data=require('fs').readFileSync('/dev/stdin','utf8');console.log(JSON.parse(data).categories.performance.score*100)")
          echo "Performance Score: $SCORE"
          if [ $(echo "$SCORE < 70" | bc) -eq 1 ]; then
            echo "::error::Performance score $SCORE is below budget (70)"
            exit 1
          fi
