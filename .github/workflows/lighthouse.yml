name: Lighthouse CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL || 'https://script.google.com/macros/s/AKfycbyYBvhRphdbvTAEI-hktpUWcpYyFjdsOjSHhHwuQyt0K310uqIX3ManTNfQ1Kx7UEtw/exec' }}

      - name: Prune non-indexable routes from static export
        run: rm -rf out/404.html out/404

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL || 'https://script.google.com/macros/s/AKfycbyYBvhRphdbvTAEI-hktpUWcpYyFjdsOjSHhHwuQyt0K310uqIX3ManTNfQ1Kx7UEtw/exec' }}

      - name: Start server
        run: |
          mkdir -p serve-root
          cp -r out serve-root/${{ github.event.repository.name }}
          npx serve serve-root -l 3000 &

      - name: Wait for server
        run: sleep 3

      - name: Check Performance Budgets (95+ lock) — all routes
        run: |
          set -e
          BASE="http://localhost:3000/${{ github.event.repository.name }}"
          URLS=(
            "$BASE/"
            "$BASE/tools/dark-print/"
            "$BASE/tools/enhance-light-pdf/"
            "$BASE/tools/protect-pdf/"
            "$BASE/tools/pdf-to-images/"
            "$BASE/tools/merge-pdf/"
            "$BASE/tools/split-pdf/"
            "$BASE/tools/image-to-pdf/"
            "$BASE/tools/password-generator/"
            "$BASE/tools/qr-generator/"
            "$BASE/tools/word-counter/"
            "$BASE/tools/case-converter/"
            "$BASE/tools/n-up/"
          )
          for URL in "${URLS[@]}"; do
            echo "→ $URL"
            rm -f ./lh.json
            npx lighthouse "$URL" \
              --output=json \
              --output-path=./lh.json \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --preset=desktop \
              --only-categories=performance,accessibility,best-practices,seo \
              || true
            node -e "
              const r=require('./lh.json');
              const thresholds={performance:70, accessibility:90, 'best-practices':95, seo:95};
              let fail=false;
              for(const c of Object.keys(thresholds)){
                const s=Math.round(r.categories[c].score*100);
                const min=thresholds[c];
                console.log('  '+c+': '+s+' (min '+min+')');
                if(s<min){ console.log('::error::'+c+' '+s+' < '+min+' at '+process.argv[1]); fail=true; }
              }
              if(fail) process.exit(1);
              console.log('  ✓ '+process.argv[1]+' passed');
            " "$URL"
          done
          echo "All budgets 95+ passed for ${#URLS[@]} URLs"
