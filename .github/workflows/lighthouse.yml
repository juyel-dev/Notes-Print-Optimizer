name: Lighthouse CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL || 'https://script.google.com/macros/s/AKfycbyYBvhRphdbvTAEI-hktpUWcpYyFjdsOjSHhHwuQyt0K310uqIX3ManTNfQ1Kx7UEtw/exec' }}

      - name: Prune non-indexable routes from static export
        run: rm -rf out/404.html out/404

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL || 'https://script.google.com/macros/s/AKfycbyYBvhRphdbvTAEI-hktpUWcpYyFjdsOjSHhHwuQyt0K310uqIX3ManTNfQ1Kx7UEtw/exec' }}

      - name: Start server
        run: |
          mkdir -p serve-root
          cp -r out serve-root/${{ github.event.repository.name }}
          npx serve serve-root -l 3000 &

      - name: Wait for server
        run: sleep 3

      - name: Check Performance Budgets (95+ lock)
        run: |
          npx lighthouse http://localhost:3000/${{ github.event.repository.name }}/ \
            --output=json \
            --output-path=./lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --preset=desktop \
            || true

          node -e "
            const r=require('./lighthouse-report.json');
            const cats=['performance','accessibility','best-practices','seo'];
            let fail=false;
            for(const c of cats){
              const s=Math.round(r.categories[c].score*100);
              console.log(c+': '+s);
              if(s<95){ console.log('::error::'+c+' '+s+' < 95'); fail=true; }
            }
            if(fail) process.exit(1);
            console.log('All budgets 95+ passed');
          "
