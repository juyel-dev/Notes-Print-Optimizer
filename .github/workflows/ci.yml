name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Hosting-agnostic quality gate — the same checks Vercel/any host relies on.
    # No GitHub Pages deploy: builds at root (no base path), like production Vercel.
    runs-on: ubuntu-latest
    env:
      # Root build — production Vercel parity. Base path is opt-in only
      # (NEXT_PUBLIC_BASE_PATH), never inferred from the environment.
      NEXT_PUBLIC_BASE_PATH: ''
      # Feedback relay (public GAS web-app URL; security enforced server-side
      # via chat_id override + endpoint whitelist + rate limiting)
      NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL || 'https://script.google.com/macros/s/AKfycbyYBvhRphdbvTAEI-hktpUWcpYyFjdsOjSHhHwuQyt0K310uqIX3ManTNfQ1Kx7UEtw/exec' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      # sharp is next's optional build-time dep (server image optimizer);
      # static export never includes it, so exclude optional deps from audit.
      - name: Dependency Audit
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke Tests (Playwright)
        run: npx playwright test --config=playwright.config.ts --project=chromium --grep-invert "worker pool runtime"
