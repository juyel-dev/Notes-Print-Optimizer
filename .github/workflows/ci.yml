name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Hosting-agnostic quality gate — the same checks Vercel/any host relies on.
    # No GitHub Pages deploy: builds at root (no base path), like production Vercel.
    runs-on: ubuntu-latest
    env:
      # Root build — production Vercel parity. Base path is opt-in only
      # (NEXT_PUBLIC_BASE_PATH), never inferred from the environment.
      NEXT_PUBLIC_BASE_PATH: ''
      # Feedback relay (public GAS web-app URL; security enforced server-side
      # via chat_id override + endpoint whitelist + rate limiting)
      NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL || 'https://script.google.com/macros/s/AKfycbyYBvhRphdbvTAEI-hktpUWcpYyFjdsOjSHhHwuQyt0K310uqIX3ManTNfQ1Kx7UEtw/exec' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Coverage (regression floor)
        run: npm run test:coverage

      - name: Dead code scan (informational)
        continue-on-error: true
        run: npm run deadcode:check

      # sharp is next's optional build-time dep (server image optimizer);
      # static export never includes it, so exclude optional deps from audit.
      - name: Dependency Audit (production)
        run: npm audit --omit=dev --omit=optional --audit-level=high

      # Non-blocking: dev-only tooling (vite/esbuild/vitest chain) has had
      # real critical/high advisories that --omit=dev above never surfaces.
      # These never ship to users, but a compromised dev server is still a
      # supply-chain risk to contributors — keep it visible without gating
      # merges on transitive dev-dependency churn we don't fully control.
      - name: Dependency Audit (dev, informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Warn if using upstream default feedback endpoint
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_FEEDBACK_URL }}" ]; then
            echo "::warning::NEXT_PUBLIC_FEEDBACK_URL repo variable is not set — this build falls back to juyel-dev's own Apps Script endpoint. Forks should set their own repo variable (see GOOGLE_APPS_SCRIPT.md) so feedback submissions don't silently go to the upstream owner."
          fi

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke Tests (Playwright)
        run: npx playwright test --config=playwright.config.ts --project=chromium --grep-invert "worker pool runtime"

      # Non-blocking: screenshots of the main screens (light/dark x desktop/
      # mobile) so a PR's UI can be reviewed without running it locally.
      - name: Visual capture (non-blocking)
        continue-on-error: true
        run: npx playwright test --config=playwright.visual.config.ts

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: visual-output/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  # Shows the screenshots inline in the PR (no zip download needed).
  # Isolated from `ci`: it never runs PR code, it only copies PNGs, and it only
  # runs for same-repo PRs (fork PRs get a read-only token anyway).
  publish-screenshots:
    needs: ci
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download screenshots
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ui-screenshots
          path: shots

      - name: Publish to ui-screenshots branch and comment on the PR
        if: steps.dl.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          rm -rf site
          if git ls-remote --exit-code --heads "$URL" ui-screenshots >/dev/null 2>&1; then
            git clone --depth 1 --branch ui-screenshots "$URL" site
          else
            mkdir site && git -C site init -q -b ui-screenshots
          fi
          cd site
          rm -rf "pr-${PR}" && mkdir -p "pr-${PR}"
          cp -r ../shots/. "pr-${PR}/"
          # keep only the 12 newest PR folders so the branch stays small
          ls -d pr-* | sort -t- -k2 -n | head -n -12 | xargs -r rm -rf
          git checkout -q --orphan fresh && git add -A
          git commit -q -m "ui screenshots for PR #${PR}"
          git push -q --force "$URL" fresh:ui-screenshots
          SHA=$(git rev-parse HEAD)
          BASE="https://raw.githubusercontent.com/${REPO}/${SHA}/pr-${PR}"
          {
            echo "<!-- ui-screenshots -->"
            echo "### UI screenshots (commit \`${GITHUB_SHA:0:7}\`)"
            echo "Captured by CI: light/dark x desktop/mobile. Best-effort — a missing step means the flow stopped there."
            for d in $(cd "pr-${PR}" && ls -d */ | tr -d / | sort); do
              echo "<details><summary><b>${d}</b></summary><p>"
              for f in $(cd "pr-${PR}/${d}" && ls *.png | grep -v '^full-' | sort); do
                echo "<img src=\"${BASE}/${d}/${f}\" width=\"320\" title=\"${f}\"> "
              done
              echo "</p></details>"
            done
          } > ../comment.md
          cd ..
          ID=$(gh api "repos/${REPO}/issues/${PR}/comments" --jq '[.[] | select(.body | contains("<!-- ui-screenshots -->"))][0].id // empty')
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${ID}" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file comment.md
          fi
